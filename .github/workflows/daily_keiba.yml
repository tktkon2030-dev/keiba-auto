name: Keiba CSV Auto Pipeline

on:
  schedule:
    # 土日の JST 09:30 / 11:45（UTC 00:30 / 02:45）
    # 祝日・代替開催は workflow_dispatch で対象日を指定して実行する。
    - cron: '30 0 * * 0,6'
    - cron: '45 2 * * 0,6'
  workflow_dispatch:
    inputs:
      target_date:
        description: '対象日 YYYY-MM-DD（空欄なら日本時間の今日）'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: keiba-csv-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: スクレイピング＆Googleドライブ保存
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          NETKEIBA_COOKIE: ${{ secrets.NETKEIBA_COOKIE }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: python keiba_scraper.py

      - name: 発走前予測を検証用に固定
        if: ${{ always() && !cancelled() }}
        run: |
          if compgen -G 'output/keiba_integrated_*.csv' > /dev/null; then
            python postrace_review.py capture --input-dir output --output-dir archive
          else
            echo 'CSV未生成のため予測記録なし'
          fi

      - name: 発走前予測をDriveへ長期保存
        if: ${{ always() && !cancelled() }}
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          GAS_ARCHIVE_TOKEN: ${{ secrets.GAS_ARCHIVE_TOKEN }}
        run: python postrace_drive.py upload --directory archive

      - name: 予測履歴の予備をGitHubにも保存
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: keiba-predictions-${{ github.run_id }}-${{ github.run_attempt }}
          path: archive/snapshot-*.json
          if-no-files-found: warn
          retention-days: 90
