name: Keiba CSV Auto Pipeline

on:
  schedule:
    # JST 09:30（UTC 00:30）と JST 11:45（UTC 02:45）に自動実行
    - cron: '30 0 * * *'
    - cron: '45 2 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: スクレイピング＆Googleドライブ保存
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          python keiba_scraper.py
